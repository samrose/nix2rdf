apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: lab
spec:
  replicas: 1
  serviceName: db
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: postgres@sha256:2222222222222222222222222222222222222222222222222222222222222222
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: db-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data
  namespace: lab
spec:
  storageClassName: local-path
  volumeName: pv-db
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-db
spec:
  storageClassName: local-path
  capacity:
    storage: 10Gi
  accessModes: [ReadWriteOnce]
  local:
    path: /var/lib/data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [edge-a]
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path
provisioner: rancher.io/local-path
